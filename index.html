<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>
</head>

<body>

    <h1>BMI Calculator</h1>

    <form method="POST">

        <label>Weight (kg):</label>
        <input type="number" name="weight" min="0.1" step="any" required>

        <br><br>

        <label>Height (cm):</label>
        <input type="number" name="height" min="0.1" step="any" required>

        <br><br>

        <button type="submit">Calculate BMI</button>

    </form>

    {% if bmi is not none %}
        <h2>Your BMI is {{ bmi }}</h2>
    {% endif %}

</body>
</html>
